<script>
    document.getElementById("year").textContent = new Date().getFullYear();

    async function loadFourthwallProducts() {
      const gridContainer = document.getElementById('album-grid');
      if (!gridContainer) return;

      try {
        // Route through CORS proxy to bypass cross-domain security blocks
        const targetUrl = encodeURIComponent('https://laredoux-shop.fourthwall.com/products.json');
        const response = await fetch(`https://api.allorigins.win/raw?url=${targetUrl}`);
        
        if (!response.ok) throw new Error('Proxy request failed');
        
        const data = await response.json();
        const products = data.products || [];

        if (products.length === 0) return;

        // Clear fallback cards once feed is retrieved
        gridContainer.innerHTML = '';

        products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'album-card';

          const imageUrl = (product.images && product.images.length > 0) 
            ? product.images[0].src 
            : './assets/images/laredoux-flavicon-elephant-ballerina.png';
          
          const title = product.title || 'Merch Item';
          const rawPrice = (product.variants && product.variants.length > 0) ? product.variants[0].price : '';
          const formattedPrice = rawPrice ? `$${rawPrice} CAD` : '';
          const productUrl = `https://laredoux-shop.fourthwall.com/products/${product.handle}`;

          card.innerHTML = `
            <div class="image-wrapper">
              <img src="${imageUrl}" alt="${title}">
            </div>
            <h3>${title}</h3>
            <p class="price">${formattedPrice}</p>
            <div class="button-group">
              <a href="${productUrl}" target="_blank" rel="noopener noreferrer" class="btn-purchase">Buy Item</a>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      } catch (error) {
        console.warn('Fourthwall auto-sync error:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadFourthwallProducts);
  </script>
