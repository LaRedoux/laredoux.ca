name: Sync Fourthwall Store Products

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-shop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch Fourthwall Products JSON
        run: |
          mkdir -p assets/data
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "https://laredoux-shop.fourthwall.com/products.json" -o assets/data/fourthwall-products.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/fourthwall-products.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Fourthwall shop data"
            git push
          else
            echo "No new products or updates found."
          fi
