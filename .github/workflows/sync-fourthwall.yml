name: Sync Fourthwall Store Products

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to manually trigger a sync anytime

jobs:
  sync-shop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Fourthwall Products JSON
        run: |
          mkdir -p assets/data
          curl -s "https://laredoux-shop.fourthwall.com/products.json" -o assets/data/fourthwall-products.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/fourthwall-products.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Fourthwall shop data"
            git push
          else
            echo "No new products or updates found."
          fi
