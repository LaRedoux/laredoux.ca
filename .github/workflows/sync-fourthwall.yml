name: Sync Fourthwall Store Products

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-shop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch Fourthwall Products JSON
        run: |
          mkdir -p assets/data
          curl -sSL "https://storefront-api.fourthwall.com/v1/collections/all/products?storefront_token=${{ secrets.FOURTHWALL_TOKEN }}" -o assets/data/fourthwall-products.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/fourthwall-products.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Fourthwall shop data"
            git push
          else
            echo "No new products or updates found."
          fi
